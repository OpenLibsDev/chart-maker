<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title data-i18n="page_title">Chart-Maker — chart & diagram builder</title>
<meta name="description" id="metaDesc" content="Free web chart & diagram builder: 28 chart types, export to PNG/JPEG/WEBP/AVIF/SVG, advanced options and effects, light/dark themes, 29 languages.">
<style>
  :root { --fg:#212529; --bg:#fff; --border:#ced4da; --muted:#6c757d; --cm-input-bg:var(--bg); --cm-input-fg:var(--fg); --cm-input-bd:var(--border); }
  body.dark { --fg:#dee2e6; --bg:#1a1d20; --border:#495057; --muted:#adb5bd; }
  * { box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--fg); background:var(--bg); }
  header,main,footer { max-width:1150px; margin:0 auto; padding:1rem; }
  header { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .brand { font-weight:700; margin-right:auto; }
  select,input,button,textarea { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--border); border-radius:.375rem; padding:.35rem .5rem; max-width:100%; }
  button { cursor:pointer; }
  h1 { font-size:1.6rem; margin:.3rem 0; }
  p.lead { color:var(--muted); margin:.2rem 0 1rem; }
  img, canvas { max-width:100%; }
  .layout { display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-start; }
  .panel { flex:1 1 300px; min-width:0; display:flex; flex-direction:column; gap:.6rem; }
  .stage-col { flex:2 1 320px; min-width:0; display:flex; flex-direction:column; gap:.4rem; border:1px solid var(--border); border-radius:.5rem; padding:.5rem; background:var(--bg); }
  .stage { height:60vh; min-height:320px; }
  .field { display:flex; flex-direction:column; gap:.2rem; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.5rem; }
  .row > * { flex:1; min-width:0; }
  textarea { width:100%; min-height:150px; font-family:ui-monospace,monospace; font-size:.85rem; }
  .msg { color:var(--muted); font-size:.85rem; min-height:1em; }
  fieldset { border:1px solid var(--border); border-radius:.5rem; min-width:0; }

    .cm-tbl{width:100%;border-collapse:collapse;margin-bottom:.4rem}
    .cm-tbl th,.cm-tbl td{padding:.15rem .25rem;border-bottom:1px solid rgba(128,128,128,.35);text-align:left;vertical-align:middle}
    .cm-in{width:100%;box-sizing:border-box;padding:.2rem .4rem;border:1px solid var(--cm-input-bd,rgba(128,128,128,.5));border-radius:.25rem;background:var(--cm-input-bg,#fff);color:var(--cm-input-fg,#212529);font:inherit}
    .cm-in option{background:var(--cm-input-bg,#fff);color:var(--cm-input-fg,#212529)}
    body.dark .cm-in, body.dark .cm-in option{background:#1a1d20;color:#dee2e6;border-color:#495057}
    .cm-btn-rm{padding:.1rem .45rem;border:1px solid rgba(128,128,128,.5);border-radius:.25rem;background:transparent;color:inherit;cursor:pointer}
    .cm-btn-add{padding:.2rem .55rem;border:1px solid rgba(128,128,128,.5);border-radius:.25rem;background:transparent;color:inherit;cursor:pointer;margin-top:.3rem}
    .cm-card{border:1px solid rgba(128,128,128,.35);border-radius:.375rem;padding:.4rem;margin:.3rem 0}
    .cm-row2{display:flex;gap:.4rem;margin-bottom:.3rem}
    .cm-lbl{font-size:.85rem;display:block;margin:.2rem 0}

    .dd{border:1px solid var(--border);border-radius:.375rem}
    .dd>summary{cursor:pointer;padding:.35rem .5rem;list-style:none;user-select:none}
    .dd>summary::-webkit-details-marker{display:none}
    .dd>summary::after{content:"\25be";float:right;opacity:.6}
    .dd[open]>summary::after{content:"\25b4"}
    .dd-body{padding:.5rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.5rem}
    .dd-row{display:flex;gap:.4rem;align-items:center}
    input[type=range]{width:100%}
    .icon-btn{display:inline-flex;align-items:center;gap:.35rem}
    .cm-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;z-index:1050;padding:3rem 1rem;overflow:auto}
    .cm-modal.open{display:flex}
    .cm-modal-box{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:.5rem;max-width:440px;width:100%;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
    .cm-modal-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
    .cm-modal-head h2{font-size:1.1rem;margin:0}
    .cm-close{border:1px solid var(--border);border-radius:.375rem;background:transparent;color:inherit;padding:.15rem .5rem;cursor:pointer}
    .btn-link{background:transparent;border:1px solid var(--border);display:block;text-align:center;text-decoration:none;color:var(--fg);padding:.5rem;border-radius:.375rem}
    .btn-link:hover{background:rgba(128,128,128,.12)}
    .cm-scroll{overflow-x:auto;max-width:100%}
    .cm-scroll>table{min-width:max-content}
    .cm-scroll .cm-in{width:auto;min-width:5rem}
    .cm-scroll input[type=date].cm-in{min-width:9rem}
    .chart-data{margin-top:0;font-size:13px;line-height:1.55}
    .chart-data h2{font-size:1rem;margin:.2rem 0 .35rem}
    .chart-data .cd-item{display:inline-block;margin:0 1.1rem .2rem 0;white-space:nowrap}
    .chart-data:empty{display:none}
</style>
</head>
<body>
<header>
  <span class="brand">Chart-Maker <small style="color:var(--muted)">library demo</small></span>
  <select id="locale"><option value="ar">العربية</option><option value="bo">བོད་ཡིག</option><option value="ca">Català</option><option value="cs">Čeština</option><option value="de">Deutsch</option><option value="en">English</option><option value="es">Español</option><option value="eu">Euskara</option><option value="fa">فارسی</option><option value="fr">Français</option><option value="he">עברית</option><option value="hi">हिन्दी</option><option value="hr">Hrvatski</option><option value="hu">Magyar</option><option value="id">Bahasa Indonesia</option><option value="is">Íslenska</option><option value="it">Italiano</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="pl">Polski</option><option value="pt">Português</option><option value="pt-BR">Português (Brasil)</option><option value="ro">Română</option><option value="ru">Русский</option><option value="sq">Shqip</option><option value="tr">Türkçe</option><option value="uk">Українська</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select>
  <button id="settingsBtn" type="button" data-i18n="settings"></button>
</header>

<main>
  <h1 id="h1">Chart & graph builder</h1>
  <p class="lead" id="lead">28 chart types with advanced options and effects, export to PNG, JPEG, WEBP, AVIF and SVG, light and dark themes, and 29 languages.</p>

  <div class="layout">
    <div class="panel">
      <div class="row">
        <button id="undo" type="button" disabled></button>
        <button id="redo" type="button" disabled></button>
      </div>
      <details class="dd">
        <summary><span id="lblAnim"></span></summary>
        <div class="dd-body">
          <label class="dd-row"><input type="checkbox" id="anim" checked> <span data-i18n="animation"></span></label>
          <div class="field"><label class="cm-lbl" data-i18n="f_anim_duration"></label><input type="range" id="animDur" min="0" max="2000" step="100" value="1000"></div>
          <div class="field"><label class="cm-lbl" data-i18n="f_anim_easing"></label><select id="animEase"><option value="linear">linear</option><option value="easeInOutQuad">easeInOutQuad</option><option value="easeOutQuart">easeOutQuart</option><option value="easeOutBounce">easeOutBounce</option><option value="easeOutElastic">easeOutElastic</option></select></div>
        </div>
      </details>
      <div class="field"><label id="lblType"></label><select id="type"></select></div>
      <div class="field"><label id="lblTitle"></label><input id="title" type="text"></div>
      <div class="field"><label id="lblDataset"></label><input id="dataset" type="text"></div>

      <fieldset>
        <legend id="lblBg"></legend>
        <div class="field"><select id="bgType">
          <option value="transparent"></option><option value="color"></option><option value="image"></option>
        </select></div>
        <input id="bgColor" type="color" value="#ffffff" style="display:none;margin-top:.4rem">
        <input id="bgImage" type="file" accept="image/*" style="display:none;margin-top:.4rem">
        <button id="bgRemove" type="button" style="display:none;margin-top:.4rem"></button>
        <details class="dd" style="margin-top:.5rem">
          <summary data-i18n="f_colors_t"></summary>
          <div class="dd-body">
            <div class="field"><label class="cm-lbl" data-i18n="f_chart_color"></label><input id="chartColor" type="color" value="#4e79a7"></div>
            <div class="field"><label class="cm-lbl" data-i18n="f_grid_color"></label><input id="gridColor" type="color" value="#888888"></div>
            <div class="field"><label class="cm-lbl" data-i18n="f_title_color"></label><input id="titleColor" type="color" value="#212529"></div>
            <div class="field"><label class="cm-lbl" data-i18n="f_legend_color"></label><input id="legendColor" type="color" value="#212529"></div>
            <div class="field"><label class="cm-lbl" data-i18n="f_tick_color"></label><input id="tickColor" type="color" value="#212529"></div>
            <div class="field"><label class="cm-lbl" data-i18n="f_data_text_color"></label><input id="dataTextColor" type="color" value="#212529"></div>
            <div class="field"><label class="cm-lbl" data-i18n="f_data_bg_color"></label><input id="dataBgColor" type="color" value="#ffffff"></div>
            <button id="colorsReset" type="button" data-i18n="colors_reset" style="margin-top:.4rem"></button>
          </div>
        </details>
      </fieldset>

      <div class="field"><label class="cm-lbl" for="dataTitle" data-i18n="f_data_title"></label><input id="dataTitle" type="text" class="cm-in" style="font-weight:600">
        <div id="dataForm"></div>
        <details class="dd" style="margin-top:.5rem">
          <summary data-i18n="adv_title"></summary>
          <div class="dd-body">
            <div class="field" id="row_subtitle"><label class="cm-lbl" data-i18n="f_subtitle"></label><input type="text" id="subTitle" class="cm-in"></div>
            <div class="field" id="row_tension"><label class="cm-lbl" data-i18n="f_tension"></label><input type="range" id="tension" min="0" max="0.5" step="0.05" value="0"></div>
            <label class="dd-row" id="row_stepped"><input type="checkbox" id="steppedChk"> <span data-i18n="f_stepped"></span></label>
            <label class="dd-row" id="row_fill"><input type="checkbox" id="fillChk"> <span data-i18n="f_fill"></span></label>
            <label class="dd-row" id="row_spangaps"><input type="checkbox" id="spanGapsChk"> <span data-i18n="f_spangaps"></span></label>
            <label class="dd-row" id="row_stacked"><input type="checkbox" id="stackedChk"> <span data-i18n="f_stacked"></span></label>
            <label class="dd-row" id="row_logy"><input type="checkbox" id="logYChk"> <span data-i18n="f_logy"></span></label>
            <label class="dd-row" id="row_decimation"><input type="checkbox" id="decimationChk"> <span data-i18n="f_decimation"></span></label>
            <div class="field" id="row_legend"><label class="cm-lbl" data-i18n="f_legend"></label>
              <select id="legendSel" class="cm-in"><option value="top" data-i18n="leg_top"></option><option value="bottom" data-i18n="leg_bottom"></option><option value="left" data-i18n="leg_left"></option><option value="right" data-i18n="leg_right"></option><option value="off" data-i18n="leg_off"></option></select></div>
            <div class="field" id="row_point"><label class="cm-lbl" data-i18n="f_point_radius"></label><input type="range" id="pointRadius" min="0" max="10" step="1" value="3"></div>
            <div class="field" id="row_linewidth"><label class="cm-lbl" data-i18n="f_line_width"></label><input type="range" id="lineWidth" min="1" max="6" step="1" value="3"></div>
            <label class="dd-row" id="row_dashed"><input type="checkbox" id="dashedChk"> <span data-i18n="f_dashed"></span></label>
            <label class="dd-row" id="row_datalabels"><input type="checkbox" id="datalabelsChk"> <span data-i18n="f_datalabels"></span></label>
            <label class="dd-row" id="row_zoom"><input type="checkbox" id="zoomChk"> <span data-i18n="f_zoom"></span></label>
            <label class="dd-row" id="row_trendline"><input type="checkbox" id="trendlineChk"> <span data-i18n="f_trendline"></span></label>
            <label class="dd-row" id="row_crosshair"><input type="checkbox" id="crosshairChk"> <span data-i18n="f_crosshair"></span></label>
            <div id="row_annotations">
              <label class="cm-lbl" data-i18n="f_annotations"></label>
              <div id="annBox"></div>
              <button class="cm-btn-add" id="addAnnBtn" type="button" data-i18n="add_annotation"></button>
            </div>
          </div>
        </details>
        <details style="margin-top:.5rem"><summary style="cursor:pointer">JSON</summary>
          <textarea id="data" spellcheck="false"></textarea>
          <button id="applyData" type="button"></button>
        </details>
      </div>

      <fieldset>
        <legend id="lblExport"></legend>
        <div class="row">
          <div class="field"><label id="lblFilename"></label><input id="filename" type="text" value="chart"></div>
          <div class="field"><label id="lblFormat"></label>
            <select id="format"><option>png</option><option>jpeg</option><option>webp</option><option>avif</option><option>svg</option><option>pdf</option></select></div>
        </div>
        <div class="row">
          <div class="field"><label id="lblW"></label><input id="w" type="number" min="1" placeholder="auto"></div>
          <div class="field"><label id="lblH"></label><input id="h" type="number" min="1" placeholder="auto"></div>
        </div>
        <label style="display:flex;gap:.4rem;align-items:center;margin-bottom:.5rem"><input type="checkbox" id="expData" checked> <span data-i18n="exp_data"></span></label>
        <div class="row">
          <button id="download" type="button"></button>
          <button id="print" type="button"></button>
          <button id="save" type="button"></button>
        </div>
      </fieldset>
      <fieldset>
        <legend id="lblImport"></legend>
        <div class="field"><label id="lblLoad"></label><input id="load" type="file" accept=".json"></div>
      </fieldset>
      <div class="msg" id="msg"></div>
      <details style="margin-top:.4rem"><summary id="lblJournal" style="cursor:pointer"></summary>
        <div id="journal" style="max-height:180px;overflow:auto;font-family:ui-monospace,monospace;font-size:.8rem;white-space:pre-wrap"></div>
        <button id="clearJournal" type="button" style="margin-top:.3rem"></button>
      </details>
    </div>

    <div class="stage-col">
      <div class="stage"><div id="chart" style="width:100%;height:100%"></div></div>
      <div class="chart-data" id="chartData"></div>
    </div>
  </div>
</main>

<footer style="color:var(--muted);border-top:1px solid var(--border);display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center">
  <span>Chart-Maker</span><span>·</span>
  <span><span id="lblFootV"></span> <span id="footVersion"></span></span><span>·</span>
  <span><span id="lblFootC"></span> <span id="footCreated"></span></span>
    <span>·</span>
    <a id="openlibsLink" href="#" target="_blank" rel="noopener" style="color:var(--muted)">OpenLibs chart-maker</a>
</footer>

<div class="cm-modal" id="settingsModal">
  <div class="cm-modal-box">
    <div class="cm-modal-head">
      <h2 data-i18n="settings"></h2>
      <button type="button" class="cm-close" id="settingsClose" aria-label="Close">&times;</button>
    </div>
    <div class="field"><label class="cm-lbl" data-i18n="set_theme"></label>
      <select id="setTheme"><option value="light" data-i18n="theme_light"></option><option value="dark" data-i18n="theme_dark"></option><option value="auto" data-i18n="theme_auto"></option></select></div>
    <div class="field"><label class="cm-lbl" data-i18n="set_language"></label>
      <select id="setLang"><option value="ar">العربية</option><option value="bo">བོད་ཡིག</option><option value="ca">Català</option><option value="cs">Čeština</option><option value="de">Deutsch</option><option value="en">English</option><option value="es">Español</option><option value="eu">Euskara</option><option value="fa">فارسی</option><option value="fr">Français</option><option value="he">עברית</option><option value="hi">हिन्दी</option><option value="hr">Hrvatski</option><option value="hu">Magyar</option><option value="id">Bahasa Indonesia</option><option value="is">Íslenska</option><option value="it">Italiano</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="pl">Polski</option><option value="pt">Português</option><option value="pt-BR">Português (Brasil)</option><option value="ro">Română</option><option value="ru">Русский</option><option value="sq">Shqip</option><option value="tr">Türkçe</option><option value="uk">Українська</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select></div>
    <a id="allAppsLink" class="btn-link" href="#" target="_blank" rel="noopener" data-i18n="all_apps"></a>
  </div>
</div>

<script type="module">
import ChartMaker from "../dist/esm/chart-maker.esm.js";
(function () {
  "use strict";
  /* LANGUAGE: taken from <html lang="xx">, or set the code here. Codes: ar bo ca cs de en es eu fa fr he hi hr hu id is it ja ko pl pt pt-BR ro ru sq tr uk zh-Hans zh-Hant */
  let savedLang = null; try { savedLang = localStorage.getItem("cm_lang"); } catch (e) {}
  const LANG = (savedLang || document.documentElement.getAttribute("lang") || "en");
  /* PATH TO THE locales/ FOLDER: next to the page by default. If the page is deeper, use an absolute path from the site root, e.g. "/chart-maker/locales/" (with a trailing slash). */
  const LOCALE_BASE = "../dist/esm/locales/";
  const cm = ChartMaker.create("#chart", { locale: LANG, urls: { worldUrl: "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json" } });
  let darkMode = false;
  let themeMode = "auto";
  const THEME_DARK = { fg:"#dee2e6", surface:"#2b3035", grid:"rgba(255,255,255,.22)" };
  const THEME_LIGHT = { fg:"#212529", surface:"#ffffff", grid:"rgba(0,0,0,.18)" };
  const $ = function (id) { return document.getElementById(id); };
  let state = cm.getState();
  function commit() { cm.setState(JSON.parse(JSON.stringify(state))); }

  let TYPEINFO = {}, countriesCache = null;
  function buildTypesInfo() { TYPEINFO = {}; cm.getTypes().forEach(function (tp) { TYPEINFO[tp.key] = tp; }); }
  function inputMode() { return (TYPEINFO[state.chartType] || { input: "lv" }).input; }
  function parseNums(s) { return String(s).split(",").map(function (x) { return Number(x.trim()); }).filter(function (n) { return !isNaN(n); }); }
  function parseList(s) { return String(s).split(",").map(function (x) { return x.trim(); }).filter(function (x) { return x.length; }); }
  function mkInput(type, val, on, ph) { const el = document.createElement("input"); el.type = type; el.className = "cm-in"; el.value = val; if (ph) el.placeholder = ph; el.addEventListener("change", on); return el; }
  function rmBtn(on) { const b = document.createElement("button"); b.type = "button"; b.className = "cm-btn-rm"; b.textContent = "\u00d7"; b.addEventListener("click", on); return b; }
  function addBtnEl(label, on) { const b = document.createElement("button"); b.type = "button"; b.className = "cm-btn-add"; b.textContent = "+ " + label; b.addEventListener("click", on); return b; }
  function applyNum(row, key, raw, el) {
    const n = cm.evalNumber(raw);
    if (!isNaN(n)) { row[key] = n; if (el) el.value = n; commit(); return; }
    if (!cm.mathReady()) { cm.loadMath().then(function () { const n2 = cm.evalNumber(raw); row[key] = isFinite(n2) ? n2 : 0; if (el) el.value = row[key]; commit(); }).catch(function () { row[key] = 0; if (el) el.value = 0; commit(); }); }
    else { row[key] = 0; if (el) el.value = 0; commit(); }

  $("applyData").addEventListener("click", function () { try { state = Object.assign(cm.getState(), JSON.parse($("data").value)); commit(); renderInputs(); refreshMeta(); } catch (err) { $("msg").textContent = "JSON error: " + err.message; } });
  $("undo").addEventListener("click", function () { cm.undo(); state = cm.getState(); renderInputs(); refreshMeta(); cm.log("j_undo", "action"); });
  $("redo").addEventListener("click", function () { cm.redo(); state = cm.getState(); renderInputs(); refreshMeta(); cm.log("j_redo", "action"); });
  $("download").addEventListener("click", function () { cm.exportImage({ format:$("format").value, filename:$("filename").value, width:parseInt($("w").value,10)||0, height:parseInt($("h").value,10)||0, includeData:$("expData").checked }); });
  $("print").addEventListener("click", function () { cm.printChart({ filename:$("filename").value, includeData:$("expData").checked }); });
  $("save").addEventListener("click", function () { cm.saveProject({ filename:$("filename").value }); cm.log("j_save_project", "action"); });
  $("load").addEventListener("change", function (e) { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = function () { try { cm.loadProject(JSON.parse(r.result)); state = cm.getState(); renderInputs(); refreshMeta(); } catch (err) { $("msg").textContent = "JSON error: " + err.message; } }; r.readAsText(f); });
})();
</script>
</body>
</html>
